<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Torneo Suizo</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- P5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>

<body class="bg-dark text-light">

<div class="container py-4">

  <h1 class="text-center mb-4">🏆 Torneo Suizo - Emparejador</h1>

  <div class="row">

    <!-- INPUT -->
    <div class="col-md-5">

      <div class="card bg-secondary text-light p-3">
        <h4>Jugadores</h4>

        <textarea id="input" class="form-control" rows="10">
Matias,2
Pedro Carranza,1
Javier Ríos,3
Antonio Rey,1
Ezequiel,0.5
Joaquin,2
Alejandro Alvez,1
Jose María,0
        </textarea>

        <button class="btn btn-warning mt-3 w-100" onclick="generar()">
          Generar emparejamientos
        </button>

      </div>

    </div>

    <!-- OUTPUT -->
    <div class="col-md-7">

      <div class="card bg-dark border-light p-3">
        <h4>Emparejamientos</h4>
        <div id="salida"></div>
      </div>

    </div>

  </div>
</div>

<script>

let jugadores = [];

function generar() {

  let texto = document.getElementById("input").value.trim();
  let lineas = texto.split("\n");

  jugadores = [];

  // 📥 cargar jugadores
  for (let l of lineas) {
    let [nombre, puntos] = l.split(",");
    jugadores.push({
      nombre: nombre.trim(),
      puntos: parseFloat(puntos),
      rivales: []
    });
  }

  // 🧠 ordenar por puntos
  jugadores.sort((a,b) => b.puntos - a.puntos);

  let libres = [...jugadores];
  let emparejamientos = [];

  // 🤝 emparejar estilo suizo simple
  while (libres.length > 1) {

    let j1 = libres.shift();
    let index = -1;
    let j2 = null;

    for (let i = 0; i < libres.length; i++) {

      if (!j1.rivales.includes(libres[i].nombre)) {
        j2 = libres[i];
        index = i;
        break;
      }
    }

    if (!j2) {
      j2 = libres[0];
      index = 0;
    }

    emparejamientos.push(`${j1.nombre} 🆚 ${j2.nombre}`);

    j1.rivales.push(j2.nombre);
    j2.rivales.push(j1.nombre);

    libres.splice(index,1);
  }

  if (libres.length === 1) {
    emparejamientos.push(`${libres[0].nombre} DESCANSA (BYE)`);
  }

  mostrar(emparejamientos);
}

// 🎨 mostrar resultados
function mostrar(lista) {

  let html = "";

  lista.forEach(e => {
    html += `<div class="alert alert-info">${e}</div>`;
  });

  document.getElementById("salida").innerHTML = html;
}

</script>

</body>
</html>
